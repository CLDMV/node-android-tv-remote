# Individual repo: .github/dependabot.yml
#
# Dependabot configuration tuned for the v4 staging-branch release flow.
#
# How it fits with v4:
#   - All Dependabot PRs target `next` so they pool with every other
#     contributor change and batch into the next release.
#   - `dependabot-auto-merge.yml` (in this same folder) auto-merges
#     patch/minor bumps into `next` after CI passes — zero-touch pooling.
#     Delete that workflow if you'd rather review each bump by hand.
#   - Security updates are detected by `hotfix-redirector.yml`
#     (release-flow-v4/) by GHSA references in the PR body and auto-promoted
#     from `next` → `hotfixes` so they ship via the hotfix lane, not the
#     next-batch release. No special routing needed in this config.
#
# Customize per repo:
#   - Add or remove `package-ecosystem` blocks for your stack (gomod, pip,
#     bundler, gradle, maven, cargo, docker, etc.).
#   - Adjust `directory` if your manifests don't live at the repo root.
#   - Tighten `open-pull-requests-limit` if Dependabot's noise is too much.
#   - Add `allow` / `ignore` rules for specific packages.
#   - Add `groups` to bundle related bumps into a single PR.

version: 2
updates:
  # GitHub Actions: keep pinned action SHAs / version tags fresh.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "next"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # Grouped PRs cut noise: one PR per (security | patch | minor) bundle
    # per week instead of N separate PRs. Security PRs still get retargeted
    # to `hotfixes` by hotfix-redirector.yml when GHSA refs appear in the
    # body — bundling N GHSA fixes into one PR is fine, the redirector
    # only needs one match to retarget.
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      patch:
        applies-to: version-updates
        update-types: ["patch"]
      minor:
        applies-to: version-updates
        update-types: ["minor"]

  # NPM: package.json + package-lock.json updates.
  # Delete this block if your repo isn't a Node project.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "next"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # vitest and @vitest/coverage-v8 (and other @vitest/* packages) peer
      # each other EXACTLY, so a partial bump (e.g. vitest to 5.0.0 while
      # @vitest/coverage-v8 stays 4.1.11) breaks `npm ci` with an ERESOLVE.
      # Bump the whole family together in one PR so the exact-peer
      # versions never diverge. Must come before security/patch/minor
      # below — Dependabot assigns each update to the FIRST matching
      # group, and this one has no applies-to restriction so it always
      # wins for vitest-family packages regardless of update type.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # @eslint/js peers eslint with a major-locked range ("^10.0.0"), so a
      # future eslint major bump without @eslint/js moving too would hit
      # the same npm ci ERESOLVE class as the vitest/coverage-v8 split.
      # @cldmv/eslint-plugin-jsonv doesn't peer eslint directly but is
      # bundled here to keep the lint-config family moving together.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@cldmv/eslint-plugin-*"
      # @cldmv/prettier-plugin-jsonv peers prettier with a major-locked
      # range ("^3.0.0") — same reasoning as the eslint group above.
      prettier:
        patterns:
          - "prettier"
          - "@cldmv/prettier-plugin-*"
      security:
        applies-to: security-updates
        patterns: ["*"]
      patch:
        applies-to: version-updates
        update-types: ["patch"]
      minor:
        applies-to: version-updates
        update-types: ["minor"]
